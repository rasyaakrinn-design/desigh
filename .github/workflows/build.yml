name: Build SO
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
      - name: Build
        run: |
          cmake -B build -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cp build/libvoicedsp.so voicedsp.so
      - uses: actions/upload-artifact@v4
        with:
          name: voicedsp
          path: voicedsp.so
